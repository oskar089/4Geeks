<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Cartas Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-success text-white">

    <div class="container py-4">
        <div class="row justify-content-center mb-4 g-2">
            <div class="col-auto">
                <input type="number" id="widthInput" class="form-control" placeholder="Ancho (px)" style="width: 120px;">
            </div>
            <div class="col-auto">
                <input type="number" id="heightInput" class="form-control" placeholder="Alto (px)" style="width: 120px;">
            </div>
            <div class="col-auto">
                <button id="drawBtn" class="btn btn-primary">Nueva Carta</button>
            </div>
        </div>

        <div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
            <div id="card" class="card shadow-lg text-black" style="width: 250px; height: 380px; border-radius: 15px; background-color: white;">
                <div class="p-2 px-3 text-start top-suit" style="font-size: 50px;"></div>
                <div class="card-body d-flex justify-content-center align-items-center value" style="font-size: 100px;"></div>
                <div class="p-2 px-3 text-end bottom-suit" style="font-size: 50px; transform: rotate(180deg);"></div>
            </div>
        </div>
        
        <p class="text-center mt-3">La carta se actualizará sola en 10 segundos.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
